definitions:
  routers.BusScoreRequest:
    properties:
      accuracy:
        type: number
      level:
        type: string
      successNum:
        type: integer
      trainingNum:
        type: integer
      userId:
        type: string
    required:
    - accuracy
    - level
    - successNum
    - trainingNum
    - userId
    type: object
  routers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  routers.MatrixResponse:
    properties:
      matrix:
        items:
          items:
            type: integer
          type: array
        type: array
      size:
        type: integer
    type: object
  routers.MemoryMatrixResponse:
    properties:
      answerTime:
        description: 返回 回答时间
        type: number
      difficulty:
        description: 返回 等级难度
        type: string
      displayTime:
        description: 返回 展示时间
        type: number
      positions:
        description: 返回的要亮的 15 个数字
        items:
          type: integer
        type: array
      totalCells:
        description: 返回一共所有的单元格
        type: integer
    type: object
  routers.MemoryScoreRequest:
    properties:
      accuracy:
        type: number
      level:
        type: string
      successNum:
        type: integer
      trainingNum:
        type: integer
      userId:
        type: string
    required:
    - accuracy
    - level
    - successNum
    - trainingNum
    - userId
    type: object
  routers.RegisterRequest:
    properties:
      password:
        description: Email    string `json:"email" binding:"required,email"`
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  routers.SchulteScoreRequest:
    properties:
      isPassed:
        type: boolean
      trainingNum:
        type: integer
      userId:
        type: string
    required:
    - isPassed
    - trainingNum
    - userId
    type: object
  routers.ScoreRequest:
    properties:
      accuracy:
        type: number
      level:
        type: string
      success_num:
        type: integer
      training_num:
        type: integer
      userId:
        type: string
    required:
    - accuracy
    - level
    - success_num
    - training_num
    - userId
    type: object
  routers.UserUpdateRequest:
    properties:
      email:
        type: string
      userId:
        type: string
      username:
        type: string
    required:
    - email
    - userId
    - username
    type: object
host: localhost:8000
info:
  contact: {}
  description: 大脑训练网页开发
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: API 文档
  version: "1.0"
paths:
  /api/v1/bus/scores:
    post:
      consumes:
      - application/json
      description: 保存用户公交车训练成绩
      parameters:
      - default: Bearer <your_token>
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 成绩数据
        in: body
        name: score
        required: true
        schema:
          $ref: '#/definitions/routers.BusScoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - ApiKeyAuth: []
      summary: 提交公交车训练成绩
      tags:
      - 公交车人数
  /api/v1/color_words/color:
    get:
      consumes:
      - application/json
      description: 通过WebSocket推送颜色变化
      produces:
      - application/json
      responses: {}
      summary: 颜色流推送
      tags:
      - 多色文字
  /api/v1/color_words/matrix:
    get:
      consumes:
      - application/json
      description: 生成一组文字和颜色不匹配的条目
      parameters:
      - default: easy
        description: 难度级别
        enum:
        - easy
        - medium
        - hard
        in: query
        name: difficulty
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: 生成颜色文字
      tags:
      - 多色文字
  /api/v1/color_words/scores:
    post:
      consumes:
      - application/json
      description: 保存用户颜色文字训练成绩
      parameters:
      - default: Bearer <your_token>
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 成绩数据
        in: body
        name: score
        required: true
        schema:
          $ref: '#/definitions/routers.ScoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - ApiKeyAuth: []
      summary: 提交颜色文字成绩
      tags:
      - 多色文字
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: 用户登录获取认证token
      parameters:
      - description: 登录凭证
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/routers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: 用户登录
      tags:
      - 认证
  /api/v1/memory/matrix:
    get:
      consumes:
      - application/json
      description: 生成一组需要记忆的方格位置
      parameters:
      - default: easy
        description: 难度级别
        enum:
        - easy
        - medium
        - hard
        in: query
        name: difficulty
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routers.MemoryMatrixResponse'
        "400":
          description: Bad Request
      summary: 生成记忆训练矩阵
      tags:
      - 瞬间记忆
  /api/v1/memory/scores:
    post:
      consumes:
      - application/json
      description: 保存用户记忆训练成绩
      parameters:
      - default: Bearer <your_token>
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 成绩数据
        in: body
        name: score
        required: true
        schema:
          $ref: '#/definitions/routers.MemoryScoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      security:
      - ApiKeyAuth: []
      summary: 提交记忆训练成绩
      tags:
      - 瞬间记忆
  /api/v1/register:
    post:
      consumes:
      - application/json
      description: 创建新用户账号
      parameters:
      - description: 注册信息
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/routers.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: 用户注册
      tags:
      - 认证
  /api/v1/schulte/matrix:
    get:
      consumes:
      - application/json
      description: 为舒尔特表格提供随机数字矩阵
      parameters:
      - default: 5
        description: 矩阵大小（如 5 表示 5x5 矩阵）
        in: query
        maximum: 10
        minimum: 3
        name: size
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回矩阵数据
          schema:
            $ref: '#/definitions/routers.MatrixResponse'
      summary: 舒尔特表格
      tags:
      - 舒尔特矩阵
  /api/v1/schulte/scores:
    post:
      consumes:
      - application/json
      description: 保存用户舒尔特表格游戏成绩
      parameters:
      - default: Bearer <your_token>
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 成绩数据
        in: body
        name: score
        required: true
        schema:
          $ref: '#/definitions/routers.SchulteScoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 保存成功响应
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 提交成绩
      tags:
      - 成绩管理
  /api/v1/user/change:
    post:
      consumes:
      - application/json
      description: 更新用户的基本信息
      parameters:
      - default: Bearer <your_token>
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 用户更新数据
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/routers.UserUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      security:
      - ApiKeyAuth: []
      summary: 更新用户信息
      tags:
      - 用户
  /api/v1/user/photo:
    post:
      consumes:
      - multipart/form-data
      description: 上传并更新用户头像
      parameters:
      - default: Bearer <your_token>
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 用户ID
        in: formData
        name: userId
        required: true
        type: string
      - description: 头像文件
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      security:
      - ApiKeyAuth: []
      summary: 上传用户头像
      tags:
      - 用户
  /api/v1/user/scores:
    get:
      consumes:
      - application/json
      description: 获取用户在各个训练中的成绩记录
      parameters:
      - default: Bearer <your_token>
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 用户ID
        in: query
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      security:
      - ApiKeyAuth: []
      summary: 获取用户所有训练成绩
      tags:
      - 用户
  /api/v1/user/users:
    get:
      consumes:
      - application/json
      description: 获取用户的个人信息
      parameters:
      - default: Bearer <your_token>
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 用户ID
        in: query
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      security:
      - ApiKeyAuth: []
      summary: 获取用户基本信息
      tags:
      - 用户
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
